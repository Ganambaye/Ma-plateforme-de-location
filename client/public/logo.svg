<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="100" rx="20" fill="url(#bg)"/>

  <g transform="translate(18, 18)">
    <path d="M8 32L4 28L8 24L12 28L8 32Z" fill="white" opacity="0.9"/>
    <path d="M0 28L8 20L16 28L8 24L0 28Z" fill="white" opacity="0.95"/>
    <rect x="6" y="28" width="4" height="6" fill="white"/>
  </g>

  <text x="62" y="42" dominant-baseline="middle" text-anchor="start" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">TANAL SA</text>
  <text x="62" y="62" dominant-baseline="middle" text-anchor="start" fill="white" font-size="18" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="1">LOGEMENT</text>

  <text x="380" y="78" dominant-baseline="middle" text-anchor="end" fill="url(#accent)" font-size="11" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5">Choisis ton logement</text>

  <circle cx="370" cy="22" r="6" fill="#fbbf24">
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
